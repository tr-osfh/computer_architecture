name: Upper Case Pascal String - Overflow Test
limit: 3000
memory_size: 0x2000
memory_mapped_io:
  0x80: [72, 101, 108, 108, 111, 87, 111, 114, 108, 100, 10]

reports:
  - name: Trace
    slice: all
    view: |
      {pc}: {instruction} | Acc={Acc:dec}
  
  - name: Result
    slice: last
    view: |
      Buffer: {memory:0:31}